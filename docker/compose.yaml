name: alfa-news

x-app: &app
  image: alfa-news-backend:local
  build: {context: .., dockerfile: docker/Dockerfile}
  environment:
    POSTGRES_DB: ${POSTGRES_DB:-alfa_news}
    POSTGRES_USER: ${POSTGRES_USER:-postgres}
    POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-alfa_local_dev}
    FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-http://127.0.0.1:5173}
    API_DEMO_ENABLED: "true"
    BOOTSTRAP_MODE: demo
    LLM_API_KEY: ${LLM_API_KEY:-}
    LLM_BASE_URL: ${LLM_BASE_URL:-https://changellenge.up.railway.app/v1}
    LLM_MODEL_TAGGING: ${LLM_MODEL_TAGGING:-qwen/qwen3.6-35b-a3b}
    LLM_MODEL_CONTEXT: ${LLM_MODEL_CONTEXT:-z-ai/glm-5.3-flash}
    LLM_MODEL_ANALYSIS: ${LLM_MODEL_ANALYSIS:-z-ai/glm-5.3-flash}
    LLM_DAILY_REQUEST_LIMIT: ${LLM_DAILY_REQUEST_LIMIT:-100}
    LLM_BUDGET_RESERVE_RUB: ${LLM_BUDGET_RESERVE_RUB:-360}
    LLM_MAX_OUTPUT_TOKENS: ${LLM_MAX_OUTPUT_TOKENS:-8192}
  volumes: ["app-runtime:/workspace/runtime"]
  logging:
    driver: json-file
    options: {max-size: "10m", max-file: "3"}
  security_opt: ["no-new-privileges:true"]

services:
  database:
    image: postgres:17-bookworm
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-alfa_news}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-alfa_local_dev}
    volumes: ["postgres-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  bootstrap:
    <<: *app
    command: ["bootstrap"]
    depends_on:
      database: {condition: service_healthy}
    restart: "no"

  api:
    <<: *app
    command: ["api"]
    ports: ["127.0.0.1:${API_PORT:-8000}:8000"]
    depends_on:
      bootstrap: {condition: service_completed_successfully}
    healthcheck:
      test: ["CMD", "python", "-m", "app.container", "health-api"]
      interval: 20s
      timeout: 15s
      retries: 3
      start_period: 60s
    stop_grace_period: 5m
    restart: unless-stopped

  worker:
    <<: *app
    command: ["worker"]
    depends_on:
      bootstrap: {condition: service_completed_successfully}
    healthcheck:
      test: ["CMD", "python", "-m", "app.container", "health-worker"]
      interval: 20s
      timeout: 15s
      retries: 3
      start_period: 60s
    stop_grace_period: 16m
    restart: unless-stopped

  frontend:
    build: {context: .., dockerfile: docker/frontend.Dockerfile}
    environment:
      VITE_API_URL: ${VITE_API_URL:-http://127.0.0.1:8000}
    ports: ["127.0.0.1:${FRONTEND_PORT:-5173}:5173"]
    depends_on:
      api: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5173').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 20s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  proxy:
    image: caddy:2-alpine
    profiles: ["https"]
    environment:
      API_DOMAIN: ${API_DOMAIN:-localhost}
    ports: ["80:80", "443:443", "443:443/udp"]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      api: {condition: service_healthy}
    restart: unless-stopped

  parser:
    <<: *app
    profiles: ["ingest"]
    command: ["parser"]
    volumes:
      - ../backend/app/newspaper_parser/data:/workspace/backend/app/newspaper_parser/data
    depends_on:
      bootstrap: {condition: service_completed_successfully}
    restart: "no"

volumes:
  postgres-data:
  app-runtime:
  caddy-data:
  caddy-config:
